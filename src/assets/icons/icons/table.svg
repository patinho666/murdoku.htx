<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Grounding Shadow: Hard-edged, 25% opacity, flat horizontal band extending straight down -->
  <rect x="25" y="152" width="150" height="28" rx="2" fill="#3A2810" fill-opacity="0.25" />

  <!-- Back Legs (Mid-tone shade) -->
  <rect x="42" y="110" width="18" height="48" rx="3" fill="#A07242" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="140" y="110" width="18" height="48" rx="3" fill="#A07242" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Under-Table Apron (Darker depth shade) -->
  <path d="M 40 120 L 160 120 L 160 142 L 40 142 Z" fill="#8C633C" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Front Legs (Mid-tone shade) -->
  <rect x="32" y="122" width="20" height="48" rx="3" fill="#B58452" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="148" y="122" width="20" height="48" rx="3" fill="#B58452" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Tabletop Front Edge / Vertical Thickness (Mid-tone shade) -->
  <path d="M 20 102 L 180 102 L 180 122 L 20 122 Z" fill="#B58452" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Tabletop Top Face: Completely Flat Overhead Projection (Brightest Tint) -->
  <rect x="20" y="28" width="160" height="74" rx="3" fill="#D8A268" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Internal Accents: Wood Grain (Thinner stroke in darker shade of base fill) -->
  <path d="M 35 48 L 125 48" stroke="#B58452" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 75 76 L 165 76" stroke="#B58452" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 30 112 L 170 112" stroke="#8C633C" stroke-width="2" stroke-linecap="round" />
</svg>
